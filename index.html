<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Laundry Caja</title>
<meta name="theme-color" content="#0a6a9b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speed Laundry">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan: app de bolsillo para la recaudación de una lavandería. Pantalla única con pestañas abajo;
   resumen arriba, formulario debajo. Azul agua de lavandería + amarillo "moneda" para el efectivo. */
:root{
  --bg:#eef4f7; --surface:#ffffff; --ink:#0f2a3a; --muted:#5b7182; --line:#d6e2ea;
  --accent:#0a6a9b; --accent-soft:#dcedf6; --coin:#c98a00; --coin-soft:#fbf0d4; --card:#5a4fcf; --card-soft:#ebe9fb;
  --ok:#1f8a55; --ok-soft:#e1f3e9; --warn:#b4471f; --warn-soft:#fbe6dd;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1820; --surface:#13232e; --ink:#e6f0f5; --muted:#91a8b7; --line:#24394a;
    --accent:#4fb3e3; --accent-soft:#16334a; --coin:#f0b93a; --coin-soft:#3a2e10; --card:#a49cf5; --card-soft:#272449;
    --ok:#5fcf93; --ok-soft:#123426; --warn:#f08a62; --warn-soft:#3d1f14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1820; --surface:#13232e; --ink:#e6f0f5; --muted:#91a8b7; --line:#24394a;
  --accent:#4fb3e3; --accent-soft:#16334a; --coin:#f0b93a; --coin-soft:#3a2e10; --card:#a49cf5; --card-soft:#272449;
  --ok:#5fcf93; --ok-soft:#123426; --warn:#f08a62; --warn-soft:#3d1f14; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:16px 0 10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex-shrink:0}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand span{font-size:13px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.wait i{background:var(--coin)}.sync.err i{background:var(--warn)}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.nav{display:flex;align-items:center;gap:8px}
.nav .t{flex:1;text-align:center}
.nav .t small{display:block;color:var(--muted);font-size:13px}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0}
.mrow{display:grid;grid-template-columns:auto 1fr 132px;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.tag{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;min-width:58px;height:34px;padding:0 8px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tag.dry{background:var(--coin-soft);color:var(--coin)}
.mname{font-size:15px}.mname small{display:block;color:var(--muted);font-size:12px}
.money{position:relative}
.money input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 30px 0 12px;text-align:right;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.money input:focus{border-color:var(--accent);background:var(--surface)}
.money::after{content:"€";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:500}
textarea{width:100%;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;resize:vertical}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border-radius:12px;padding:10px 12px;background:var(--bg)}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{font-size:20px;font-variant-numeric:tabular-nums}
.tile.cash{background:var(--coin-soft)}.tile.card{background:var(--card-soft)}.tile.tot{background:var(--accent-soft)}
.big{white-space:nowrap;font-family:var(--display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}
.chip.up{background:var(--ok-soft);color:var(--ok)}.chip.down{background:var(--warn-soft);color:var(--warn)}.chip.flat{background:var(--bg);color:var(--muted)}
.btn{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06202e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#06202e}}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--line)}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink)}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.months button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;position:relative}
.months button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.months button.has::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.months button.on.has::after{background:#fff}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .amt{text-align:right;font-variant-numeric:tabular-nums}
.li .amt small{display:block;font-size:12px;color:var(--muted)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px;border-bottom:2px solid var(--ink)}
.mhead b{font-family:var(--display);font-size:20px;font-weight:600}
.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
tr.q td{background:var(--accent-soft);font-weight:600}
tr.tot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
td.miss{color:var(--muted)}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:120px;padding-top:6px}
.chart .col{display:flex;flex-direction:column-reverse;height:100%;border-radius:4px;background:var(--bg);overflow:hidden;position:relative}
.chart .col i{display:block}
.chart .c{background:var(--coin)}.chart .k{background:var(--card)}
.chart .col.cur{outline:2px solid var(--accent);outline-offset:1px}
.axis{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--accent-soft);color:var(--ink)}
.note.warn{background:var(--warn-soft)}.note.coin{background:var(--coin-soft)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabbar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{min-height:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);border-top:3px solid transparent}
.tabbar button.on{color:var(--accent);border-top-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.login{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.login form{width:100%;max-width:380px}
.login input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;min-height:36px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.mrow{grid-template-columns:auto 1fr 112px;gap:8px}.tile b{font-size:17px}.big{font-size:38px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2.5"></rect><circle cx="12" cy="13" r="4.5"></circle><path d="M7 6.5h2"></path></svg></div>
    <div class="brand"><b>Speed Laundry Shop</b><span>Recaudación y lecturas</span></div>
    <div class="sync wait" id="sync"><i></i><span>Conectando…</span></div>
    <button class="ibtn" id="logout" title="Cerrar sesión" aria-label="Cerrar sesión" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 16l-4-4 4-4M6 12h10"></path></svg></button>
  </header>
  <main id="main" class="stack"></main>
</div>
<nav class="tabbar" aria-label="Secciones"><div>
  <button data-tab="viernes" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v8M9.5 10.2c0-1 1.1-1.7 2.5-1.7s2.5.7 2.5 1.7-1.1 1.5-2.5 1.8-2.5.8-2.5 1.8 1.1 1.7 2.5 1.7 2.5-.7 2.5-1.7"></path></svg>Viernes</button>
  <button data-tab="historial"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Historial</button>
  <button data-tab="maquinas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2.5"></rect><circle cx="12" cy="13" r="4.5"></circle></svg>Máquinas</button>
  <button data-tab="asesor"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>Asesor</button>
</div></nav>
<div class="login" id="login" hidden>
  <form id="lgForm" class="panel stack" autocomplete="on">
    <div class="row"><div class="logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2.5"></rect><circle cx="12" cy="13" r="4.5"></circle><path d="M7 6.5h2"></path></svg></div><div class="brand"><b>Speed Laundry Shop</b><span>Entra para ver tu recaudación</span></div></div>
    <div id="lgEmailBox" class="stack" style="gap:6px" hidden><label class="small muted" for="lgEmail">Correo</label><input id="lgEmail" type="email" autocomplete="username" value="linuxielaxl@gmail.com" required></div>
    <label class="small muted" for="lgPass">Clave de acceso</label><input id="lgPass" type="password" autocomplete="current-password" required autofocus>
    <div class="note warn" id="lgErr" hidden></div>
    <button class="btn pri block" id="lgBtn" type="submit">Entrar</button>
    <div class="row" style="justify-content:space-between"><button class="linkbtn" id="lgReset" type="button">He olvidado la clave</button><button class="linkbtn" id="lgOther" type="button">Otro correo</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ───── Datos fijos ───── */
const MACH = [
  { id: 'l18',  tag: 'L18',   name: 'Lavadora 18 kg', dry: false },
  { id: 'l11a', tag: 'L11·A', name: 'Lavadora 11 kg', sub: 'A', dry: false },
  { id: 'l11b', tag: 'L11·B', name: 'Lavadora 11 kg', sub: 'B', dry: false },
  { id: 's18a', tag: 'S18·A', name: 'Secadora 18 kg', sub: 'A', dry: true },
  { id: 's18b', tag: 'S18·B', name: 'Secadora 18 kg', sub: 'B', dry: true }
];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DOW = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

/* ───── Utilidades ───── */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = (s) => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] || 1); };
const addDays = (s, k) => { const d = parseISO(s); d.setDate(d.getDate() + k); return toISO(d); };
const num = (v) => { if (v == null || v === '') return 0; const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : Math.round(n * 100) / 100; };
const r2 = (n) => Math.round(n * 100) / 100;
const eur = (n) => r2(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const eur0 = (n) => r2(n).toLocaleString('es-ES', { maximumFractionDigits: 2 }) + ' €';
const fmtIn = (n) => n == null || n === '' ? '' : String(n).replace('.', ',');
function lastFriday(iso) { const d = parseISO(iso); const k = (d.getDay() - 5 + 7) % 7; d.setDate(d.getDate() - k); return toISO(d); }
const todayISO = () => toISO(new Date());
const dLong = (s) => { const d = parseISO(s); return DOW[d.getDay()][0].toUpperCase() + DOW[d.getDay()].slice(1) + ' ' + d.getDate() + ' de ' + MONTHS[d.getMonth()]; };
const dShort = (s) => { const d = parseISO(s); return d.getDate() + ' ' + MS[d.getMonth()].toLowerCase(); };
const cap = (s) => s[0].toUpperCase() + s.slice(1);
let toastT;
function toast(m, ms) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 2600); }
function setSync(state, text) { const s = $('#sync'); s.className = 'sync ' + (state || ''); s.querySelector('span').textContent = text; }

/* ───── Estado ───── */
const D = { weeks: {}, readings: {} };
const S = { tab: 'viernes', fri: lastFriday(todayISO()), year: new Date().getFullYear(), rMonth: new Date().getMonth() + 1, aPer: 'q' + Math.ceil((new Date().getMonth() + 1) / 3), draft: null, rDraft: null };
let DB = null, MODE = 'loading';

function weekTotals(w) {
  const cash = w ? MACH.reduce((s, m) => s + num(w.cash && w.cash[m.id]), 0) : 0;
  const card = w ? num(w.card) : 0;
  return { cash: r2(cash), card: card, total: r2(cash + card) };
}
function weeksOfYear(y) { return Object.values(D.weeks).filter((w) => w.date && w.date.startsWith(String(y))).sort((a, b) => a.date.localeCompare(b.date)); }
function monthSum(y, m) { const p = y + '-' + pad(m); const t = { cash: 0, card: 0, total: 0, n: 0 }; Object.values(D.weeks).forEach((w) => { if (w.date && w.date.startsWith(p)) { const x = weekTotals(w); t.cash += x.cash; t.card += x.card; t.total += x.total; t.n++; } }); return t; }
function reading(y, m) { return D.readings[y + '-' + pad(m)] || null; }
function readingTotal(r) { return r ? r2(MACH.reduce((s, x) => s + num(r.m && r.m[x.id]), 0)) : 0; }
function hasReading(r) { return !!(r && r.m && MACH.some((x) => r.m[x.id] !== '' && r.m[x.id] != null)); }

/* ───── Borradores ───── */
function draftFor(date) {
  const w = D.weeks[date];
  return { date: date, cash: Object.fromEntries(MACH.map((m) => [m.id, w && w.cash && w.cash[m.id] != null && w.cash[m.id] !== '' ? fmtIn(w.cash[m.id]) : ''])), card: w && w.card != null && w.card !== '' ? fmtIn(w.card) : '', notes: (w && w.notes) || '', dirty: false };
}
function rDraftFor(y, m) {
  const r = reading(y, m);
  return { ym: y + '-' + pad(m), m: Object.fromEntries(MACH.map((x) => [x.id, r && r.m && r.m[x.id] != null && r.m[x.id] !== '' ? fmtIn(r.m[x.id]) : ''])), dirty: false };
}

/* ───── Pantalla: Viernes ───── */
function vViernes() {
  if (!S.draft || S.draft.date !== S.fri) S.draft = draftFor(S.fri);
  const dr = S.draft; const saved = !!D.weeks[S.fri];
  let h = '<section class="panel stack"><div class="nav"><button class="ibtn" data-act="fri" data-d="-7" aria-label="Viernes anterior">' + svgL + '</button><div class="t"><h2>' + esc(dLong(S.fri)) + '</h2><small>' + parseISO(S.fri).getFullYear() + (S.fri === lastFriday(todayISO()) ? ' · esta semana' : '') + (saved ? ' · guardado' : ' · sin apuntar') + '</small></div><button class="ibtn" data-act="fri" data-d="7" aria-label="Viernes siguiente">' + svgR + '</button></div>';
  h += '<div id="vsum">' + vSummary() + '</div></section>';
  h += '<section class="panel"><h3>Efectivo de cada máquina</h3><div>' + MACH.map((m) => '<div class="mrow"><span class="tag' + (m.dry ? ' dry' : '') + '">' + m.tag + '</span><label class="mname" for="c-' + m.id + '">' + m.name + (m.sub ? ' <small>Máquina ' + m.sub + '</small>' : '') + '</label><div class="money"><input id="c-' + m.id + '" data-in="cash" data-m="' + m.id + '" inputmode="decimal" autocomplete="off" placeholder="0,00" value="' + esc(dr.cash[m.id]) + '"></div></div>').join('') + '</div></section>';

/* ───── Pantalla: Asesor ───── */
function perRange() { const p = S.aPer; if (p === 'year') return { from: 1, to: 12, label: 'Año ' + S.year, tag: String(S.year) }; const q = +p.slice(1); return { from: (q - 1) * 3 + 1, to: q * 3, label: q + '.º trimestre ' + S.year, tag: q + 'T' + S.year }; }
function vAsesor() {

  let h = '<section class="panel stack"><div class="nav"><button class="ibtn" data-act="year" data-d="-1" aria-label="Año anterior">' + svgL + '</button><div class="t"><h2>Para el asesor</h2><small>' + esc(r.label) + '</small></div><button class="ibtn" data-act="year" data-d="1" aria-label="Año siguiente">' + svgR + '</button></div>';

/* ───── Exportación ───── */
function buildWorkbook() {
  const y = S.year; const r = perRange(); const wb = XLSX.utils.book_new();
  const head = ['Mes'].concat(MACH.map((x) => x.name + (x.sub ? ' ' + x.sub : ''))).concat(['Total']);
  const rows = [['Speed Laundry Shop · Lecturas por máquina · ' + r.label], [], head];
  const tot = MACH.map(() => 0); let all = 0;
  for (let m = r.from; m <= r.to; m++) { const rd = reading(y, m); const vals = MACH.map((x, i) => { const v = hasReading(rd) ? num(rd.m[x.id]) : 0; tot[i] += v; return v; }); const t = r2(vals.reduce((a, b) => a + b, 0)); all += t; rows.push([cap(MONTHS[m - 1]) + ' ' + y].concat(vals).concat([t])); }
  rows.push(['Total ' + r.label].concat(tot.map(r2)).concat([r2(all)]));
  const ws1 = XLSX.utils.aoa_to_sheet(rows); ws1['!cols'] = [{ wch: 20 }].concat(MACH.map(() => ({ wch: 16 }))).concat([{ wch: 12 }]);
  XLSX.utils.book_append_sheet(wb, ws1, 'Lecturas máquinas');
  const rows2 = [['Speed Laundry Shop · Recaudación por mes · ' + r.label], [], ['Mes', 'Efectivo', 'Tarjeta', 'Total recaudado', 'Según máquinas', 'Diferencia']];
  let a = 0, b = 0, c = 0;
  for (let m = r.from; m <= r.to; m++) { const s = monthSum(y, m); const rd = reading(y, m); const rt = hasReading(rd) ? readingTotal(rd) : ''; a += s.cash; b += s.card; c += rt || 0; rows2.push([cap(MONTHS[m - 1]) + ' ' + y, r2(s.cash), r2(s.card), r2(s.total), rt, rt === '' ? '' : r2(rt - s.total)]); }
  rows2.push(['Total', r2(a), r2(b), r2(a + b), r2(c), '']);
  const ws2 = XLSX.utils.aoa_to_sheet(rows2); ws2['!cols'] = [{ wch: 20 }, { wch: 12 }, { wch: 12 }, { wch: 16 }, { wch: 16 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws2, 'Recaudación');
  const rows3 = [['Speed Laundry Shop · Recaudación de cada viernes · ' + r.label], [], ['Viernes'].concat(MACH.map((x) => x.tag)).concat(['Efectivo', 'Tarjeta', 'Total', 'Notas'])];
  weeksOfYear(y).filter((w) => { const m = +w.date.slice(5, 7); return m >= r.from && m <= r.to; }).forEach((w) => { const x = weekTotals(w); rows3.push([w.date.split('-').reverse().join('/')].concat(MACH.map((mm) => num(w.cash && w.cash[mm.id]))).concat([x.cash, x.card, x.total, w.notes || ''])); });
  const ws3 = XLSX.utils.aoa_to_sheet(rows3); ws3['!cols'] = [{ wch: 12 }].concat(MACH.map(() => ({ wch: 9 }))).concat([{ wch: 11 }, { wch: 11 }, { wch: 11 }, { wch: 30 }]);
  XLSX.utils.book_append_sheet(wb, ws3, 'Viernes');
  return { wb: wb, name: 'Speed_Laundry_' + r.tag + '.xlsx' };
}
async function doXlsx() {
  if (!window.XLSX) { toast('No se pudo cargar el generador de Excel. Usa «Copiar resumen».', 4000); return; }
  const out = buildWorkbook(); const data = XLSX.write(out.wb, { bookType: 'xlsx', type: 'array' });
  const file = new File([data], out.name, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  // En el móvil, abre el menú de compartir (correo, WhatsApp, Archivos…); en el ordenador, lo descarga.
  if (navigator.canShare && /Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: out.name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = out.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000); toast('Excel descargado: ' + out.name);
}

  saveWeek: () => saveWeek(), delWeek: () => delWeek(), saveRead: () => saveRead(),
  xlsx: () => doXlsx(),
  copy: async () => { try { await navigator.clipboard.writeText(summaryText()); toast('Resumen copiado. Pégalo en un correo o WhatsApp.'); } catch (e) { toast('No se pudo copiar aquí', 3000); } }
};
document.addEventListener('click', (e) => {
  const t = e.target.closest('.tabbar button'); if (t) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el); }
});
document.addEventListener('input', (e) => {
  const el = e.target; const k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'cash' || k === 'card' || k === 'notes') {
    const dr = S.draft; if (k === 'cash') dr.cash[el.dataset.m] = el.value; else if (k === 'card') dr.card = el.value; else dr.notes = el.value;
    dr.dirty = true; const s = $('#vsum'); if (s) s.innerHTML = vSummary(); const b = $('#saveWeek'); if (b) b.textContent = 'Guardar recaudación del viernes';
  } else if (k === 'read') {
    const dr = S.rDraft; dr.m[el.dataset.m] = el.value; dr.dirty = true;
    const s = $('#rsum'); if (s) s.textContent = eur(MACH.reduce((a, x) => a + num(dr.m[x.id]), 0));
    const b = document.querySelector('[data-act="saveRead"]'); if (b) b.textContent = 'Guardar lecturas de ' + MONTHS[S.rMonth - 1];
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('.money input')) { const all = [...document.querySelectorAll('.money input')]; const i = all.indexOf(e.target); if (all[i + 1]) all[i + 1].focus(); else e.target.blur(); } });

/* ───── Conexión con Firebase ───── */
render();
let unsubs = [];
const AUTH_ERR = { 'auth/invalid-email': 'El correo no es válido.', 'auth/user-not-found': 'Clave incorrecta.', 'auth/wrong-password': 'Clave incorrecta.', 'auth/invalid-credential': 'Clave incorrecta.', 'auth/invalid-login-credentials': 'Clave incorrecta.', 'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos.', 'auth/network-request-failed': 'Sin conexión a internet.' };
function startData() {
  let got = { w: false, r: false }; MODE = 'loading'; setSync('wait', 'Conectando…');
  const timer = setTimeout(() => { if (MODE === 'loading') { MODE = 'slow'; setSync('wait', 'Sin conexión'); render(); } }, 10000);
  const ready = (meta) => { if (got.w && got.r) { clearTimeout(timer); MODE = 'ok'; if (meta.hasPendingWrites) setSync('wait', 'Guardando…'); else if (meta.fromCache) setSync('wait', 'Sin conexión · se guardará al volver'); else setSync('', 'Sincronizado'); } };
  const apply = () => { if (S.draft && !S.draft.dirty) S.draft = null; if (S.rDraft && !S.rDraft.dirty) S.rDraft = null; const busy = document.activeElement && document.activeElement.matches && document.activeElement.matches('input,textarea'); if (!busy) render(); };
  const onErr = (err) => { clearTimeout(timer); MODE = 'slow'; setSync('err', err && err.code === 'permission-denied' ? 'Sin permiso' : 'Error de conexión'); render(); if (err && err.code === 'permission-denied') toast('Esta cuenta no tiene permiso para ver los datos de la lavandería.', 6000); };
  unsubs.push(DB.collection('weeks').onSnapshot({ includeMetadataChanges: true }, (snap) => { D.weeks = {}; snap.docs.forEach((d) => { const x = d.data(); if (x && x.date) D.weeks[x.date] = x; }); got.w = true; ready(snap.metadata); apply(); }, onErr));
  unsubs.push(DB.collection('readings').onSnapshot({ includeMetadataChanges: true }, (snap) => { D.readings = {}; snap.docs.forEach((d) => { const x = d.data(); if (x && x.ym) D.readings[x.ym] = x; }); got.r = true; ready(snap.metadata); apply(); }, onErr));
}
(function boot() {
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey || /PEGA_AQUI/.test(cfg.apiKey)) { MODE = 'local'; setSync('err', 'Sin configurar'); render(); return; }
  firebase.initializeApp(cfg);
  const auth = firebase.auth(); DB = firebase.firestore();
  try { DB.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) { /* sin modo sin conexión */ }
  $('#lgForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const b = $('#lgBtn'), er = $('#lgErr'); er.hidden = true; b.disabled = true; b.textContent = 'Entrando…';
    try { await auth.signInWithEmailAndPassword($('#lgEmail').value.trim(), $('#lgPass').value); }
    catch (err) { er.textContent = AUTH_ERR[err.code] || ('No se pudo entrar: ' + err.message); er.hidden = false; }
    b.disabled = false; b.textContent = 'Entrar';
  });
  $('#lgOther').addEventListener('click', () => { $('#lgEmailBox').hidden = false; $('#lgOther').hidden = true; $('#lgEmail').focus(); });
  $('#lgReset').addEventListener('click', async () => {
    const em = $('#lgEmail').value.trim(), er = $('#lgErr');
    if (!em) { er.textContent = 'Escribe tu correo arriba y vuelve a pulsar.'; er.hidden = false; return; }
    try { await auth.sendPasswordResetEmail(em); er.textContent = 'Te hemos enviado un correo a ' + em + ' para cambiar la clave.'; er.hidden = false; } catch (err) { er.textContent = AUTH_ERR[err.code] || err.message; er.hidden = false; }
  });
  $('#logout').addEventListener('click', () => { if (S.draft && S.draft.dirty && !window.__confirmOut) { window.__confirmOut = true; toast('Tienes cambios sin guardar. Pulsa otra vez para salir.'); setTimeout(() => { window.__confirmOut = false; }, 4000); return; } auth.signOut(); });
  auth.onAuthStateChanged((u) => {
    unsubs.forEach((f) => f()); unsubs = [];
    if (u) { $('#login').hidden = true; $('#logout').hidden = false; startData(); }
    else { D.weeks = {}; D.readings = {}; S.draft = null; S.rDraft = null; MODE = 'loading'; $('#login').hidden = false; $('#logout').hidden = true; setSync('wait', 'Sin sesión'); render(); }
  });
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
